name: CI

on:
  push:
    branches-ignore: ["capturas"]
  pull_request:
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q app tests

      - name: Rodar testes
        run: pytest -q --maxfail=5

  frontend:
    name: Frontend (build + tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Build de produção
        run: npm run build

  docker:
    name: Docker Compose (validação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile https config --quiet

  capturas:
    name: Capturas de tela (dados de demonstração)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Subir API com dados de demonstração
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./demo.db
          APP_PASSWORD: demo
          JWT_SECRET: demo-ci
        run: |
          pip install -r requirements.txt
          python -m app.scripts.seed_demo
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build e subir o PWA
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 nohup node .next/standalone/server.js > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 1; done

      - name: Tirar capturas
        working-directory: frontend
        env:
          SENHA: demo
          SAIDA: ${{ github.workspace }}/capturas
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/capturas.mjs

      - name: Publicar no branch "capturas"
        working-directory: capturas
        run: |
          git init -q -b capturas
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" capturas

      - name: Logs em caso de falha
        if: failure()
        run: |
          tail -n 80 backend/api.log || true
          tail -n 80 frontend/web.log || true
