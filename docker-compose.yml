services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: licita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licita}
      POSTGRES_DB: licita
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licita"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://licita:${POSTGRES_PASSWORD:-licita}@db:5432/licita
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://licita:${POSTGRES_PASSWORD:-licita}@db:5432/licita
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "3000:3000"

  # HTTPS automático (Let's Encrypt) — obrigatório para push e instalação no Android.
  # Suba com: docker compose --profile https up -d   (exige DOMAIN no .env apontando para o servidor)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
